name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: claims-intake

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Mypy
        run: uv run mypy

      - name: Run Pytest
        run: uv run pytest

      - name: Deliberate gate failure
        run: exit 1